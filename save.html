<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>コーデ保存</title>

    <!-- Firebase SDK (v10 Compat) の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- ★ログイン連携に必要な Auth SDK を追加 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
      // Firebase 設定情報（他画面と共通）
      const firebaseConfig = {
        apiKey: "AIzaSyA_a35sK_zsTwwui5YlY0_ftSyEwJHyeoc",
        authDomain: "coordinary-7accd.firebaseapp.com",
        projectId: "coordinary-7accd",
        storageBucket: "coordinary-7accd.firebasestorage.app",
        messagingSenderId: "235582648668",
        appId: "1:235582648668:web:e0c70a45e659307fcad199"
      };

      // Firebase の初期化
      firebase.initializeApp(firebaseConfig);
      window.db = firebase.firestore();
      window.auth = firebase.auth(); // ★Authオブジェクトをグローバル化

      // ★未ログインユーザーを login.html へ自動リダイレクトするガード処理
      window.auth.onAuthStateChanged((user) => {
        if (!user) {
          console.log("未ログインのため、login.htmlへ遷移します");
          location.href = "login.html";
        } else {
          console.log("ログイン中のユーザー:", user.displayName || user.email);
        }
      });
    </script>
</head>
<body>

<div class="preview" style="width: 250px; height: 250px; border: 2px solid #ccc; overflow: hidden; display: flex; justify-content: center; align-items: center;">
    <img id="outfitPreviewImage" src="" style="max-width: 100%; max-height: 100%;">
</div>

<br>

<label>日付</label><br>
<input type="date" id="outfitDate">

<br><br>

<label>気温</label><br>
<input type="text" id="outfitTemp" placeholder="25">

<br><br>

<label>天気</label><br>
<select id="outfitWeather">
    <option>晴れ</option>
    <option>曇り</option>
    <option>雨</option>
    <option>雪</option>
</select>

<br><br>

<label>タグ</label><br>
<input type="text" id="outfitTag" placeholder="デート・通学など">

<br><br>

<label>メモ</label><br>
<textarea id="outfitMemo" rows="4" cols="30"></textarea>

<br><br>

<button onclick="saveOutfit()">保存する</button>

<script src="JavaScript/save.js"></script>

</body>
</html>
