<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coordiary - Coordinate</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK (v10 Compat) の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- ★ログイン連携に必要な Auth SDK を追加 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
      // Firebase 設定情報（他画面と共通）
      const firebaseConfig = {
        apiKey: "AIzaSyA_a35sK_zsTwwui5YlY0_ftSyEwJHyEoc",
        authDomain: "coordinary-7accd.firebaseapp.com",
        projectId: "coordinary-7accd",
        storageBucket: "coordinary-7accd.firebasestorage.app",
        messagingSenderId: "235582648668",
        appId: "1:235582648668:web:e0c70a45e659307fcad199"
      };

      // Firebase の初期化
      firebase.initializeApp(firebaseConfig);
      window.db = firebase.firestore();
      window.auth = firebase.auth(); // ★Authオブジェクトをグローバル化

      // ★未ログインユーザーを index.html へ自動リダイレクトするガード処理
      window.auth.onAuthStateChanged((user) => {
        if (!user) {
          console.log("未ログインのため、index.htmlへ遷移します");
          location.href = "index.html";
        } else {
          console.log("ログイン中のユーザー:", user.displayName || user.email);
        }
      });
    </script>
</head>

<body>

    <header class="top-bar">
        <h1>コーデ作成</h1>
    </header>

    <main class="coord-main">

        <!-- クローゼット -->
        <section class="closet">

            <h2>Closet</h2>

            <!-- 所持状態フィルター -->
            <select id="filterStatus" onchange="changeStatusFilter()">
                <option value="all">すべて</option>
                <option value="所持服">所持服のみ</option>
                <option value="未所持服">未所持服のみ</option>
            </select>

            <!-- カテゴリ -->
            <select id="filterCategory" onchange="changeCategory()">
                <option value="すべて">すべて</option>
                <option value="トップス">トップス</option>
                <option value="ボトムス">ボトムス</option>
                <option value="ワンピース">ワンピース</option>
                <option value="アウター">アウター</option>
                <option value="シューズ">シューズ</option>
                <option value="アクセサリー">アクセサリー</option>
            </select>

            <!-- 服一覧 -->
            <div id="closet-items" class="closet-list"></div>

        </section>

        <!-- コーデ作成 -->
        <section class="coord-section">
            <div class="side-left">
                <button id="clearBtn" class="circle-btn delete">🗑</button>
                <button id="saveBtn" class="circle-btn save">💾</button>
            </div>

            <!-- コーデキャンバス -->
            <div id="drop-area" class="coord-canvas">
                <p class="guide-text">服を選択してください</p>
            </div>

        </section>

    </main>

    <!-- 下部ナビゲーションバー -->
    <nav class="bottom-nav">
        <a href="closet.html">
            <img src="images/closet.png" alt="クローゼット">
        </a>

        <!-- ★現在ページ（コーデ作成）を active に統一 -->
        <a href="coordinate.html" class="active">
            <img src="images/coordinatered.png" alt="コーデ作成">
        </a>

        <a href="outfit.html">
            <img src="images/outfit.png" alt="コーデ履歴">
        </a>
    </nav>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="JavaScript/coordinate.js"></script>

</body>

</html>
