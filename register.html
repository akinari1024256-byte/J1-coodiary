<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服登録 - coordinary</title>

<!-- 共通スタイルの読み込み -->
<link rel="stylesheet" href="css/style.css">

<!-- Firebase SDK (v10 Compat) の読み込み -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- ★ログイン連携に必要な Auth SDK を追加 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
  // Firebase 設定情報
  const firebaseConfig = {
    apiKey: "AIzaSyA_a35sK_zsTwwui5YlY0_ftSyEwJHyEoc",
    authDomain: "coordinary-7accd.firebaseapp.com",
    projectId: "coordinary-7accd",
    storageBucket: "coordinary-7accd.firebasestorage.app",
    messagingSenderId: "235582648668",
    appId: "1:235582648668:web:e0c70a45e659307fcad199"
  };

  // Firebase の初期化
  firebase.initializeApp(firebaseConfig);
  window.db = firebase.firestore();
  window.auth = firebase.auth(); // ★Authオブジェクトをグローバル化

  // ★未ログインユーザーを login.html へ自動リダイレクトするガード処理
  window.auth.onAuthStateChanged((user) => {
    if (!user) {
      console.log("未ログインのため、login.htmlへ遷移します");
      location.href = "login.html";
    } else {
      console.log("ログイン中のユーザー:", user.displayName || user.email);
    }
  });
</script>

<style>
/* 登録画面固有の追加レイアウト調整 */
.register-container {
    max-width: 500px;
    margin: 20px auto;
    padding: 24px;
    background: var(--card-bg, #ffffff);
    border-radius: var(--radius-lg, 16px);
    box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.04));
    border: 1px solid var(--border-color, #e9ecef);
    box-sizing: border-box;
}

.preview {
    width: 100%;
    max-width: 280px;
    height: 280px;
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius-md, 12px);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color, #f8f9fa);
    margin: 0 auto 20px;
}

.preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-primary, #2c3e50);
}

.form-group input[type="file"],
.form-group select,
.form-group textarea {
    width: 100%;
}

.btn-submit {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 10px;
}

/* モーダルダイアログ */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background-color: #fff;
    padding: 24px;
    border-radius: var(--radius-lg, 16px);
    width: 340px;
    max-width: 90%;
    box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.15));
    text-align: left;
}

.modal-content h3 {
    margin-top: 0;
    font-size: 18px;
    margin-bottom: 15px;
}

.modal-preview {
    width: 180px;
    height: 180px;
    border: 1px dashed var(--border-color, #e9ecef);
    border-radius: 8px;
    margin: 10px auto 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color, #f8f9fa);
}

.modal-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 10px 8px;
    font-size: 13px;
}
</style>
</head>

<body>

<header class="top-bar">
    <h1>服を登録</h1>
</header>

<main class="register-container">

    <div class="preview">
        <img id="previewImage" alt="">
    </div>

    <!-- ① ライブラリ/アルバムから選択 -->
    <div class="form-group">
        <label for="imageInput">📁 アルバムから選ぶ</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <!-- ② スマホのカメラを直接起動して撮影 -->
    <div class="form-group">
        <label for="cameraInput">📷 カメラで撮影する</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <div class="form-group">
        <label for="category">カテゴリ</label>
        <select id="category">
            <option>トップス</option>
            <option>ボトムス</option>
            <option>ワンピース</option>
            <option>アウター</option>
            <option>シューズ</option>
            <option>アクセサリー</option>
        </select>
    </div>

    <div class="form-group">
        <label for="status">状態</label>
        <select id="status">
            <option>所持服</option>
            <option>未所持服</option>
        </select>
    </div>

    <div class="form-group">
        <label for="memo">メモ</label>
        <textarea id="memo" rows="4"></textarea>
    </div>

    <button class="btn-submit" onclick="saveClothes()">保存</button>

</main>

<!-- 確認モーダル -->
<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <h3>登録内容の確認</h3>
        
        <p style="font-size: 13px; margin-bottom: 5px;"><strong>【切り抜き結果】</strong></p>
        <div class="modal-preview">
            <img id="croppedPreviewImage" alt="切り抜き画像">
        </div>

        <p style="font-size: 14px; margin: 6px 0;"><strong>カテゴリ:</strong> <span id="confirmCategory"></span></p>
        <p style="font-size: 14px; margin: 6px 0;"><strong>状態:</strong> <span id="confirmStatus"></span></p>
        <p style="font-size: 14px; margin: 6px 0;"><strong>メモ:</strong> <span id="confirmMemo"></span></p>
        <p id="confirmAiInfo" style="font-size: 0.8em; color: var(--text-secondary, #7f8c8d); margin-top: 8px;"></p>

        <div class="modal-buttons">
            <button onclick="closeModal()" id="editButton">キャンセル</button>
            <button onclick="submitToFirebase()">この内容で登録</button>
        </div>
    </div>
</div>

<script src="JavaScript/register.js"></script>

</body>
</html>
